# XP gagnée par action. Les clés sont les noms Bukkit en MAJUSCULES.
xp:
  actionbar: true          # affiche +XP dans l'action bar
  ignore-creative: true    # pas d'XP en créatif
  playtime-per-minute: 10  # XP par minute de jeu (0 = désactivé)
  bossbar:
    enabled: true          # BossBar de progression à chaque gain d'XP
    seconds: 5             # durée d'affichage après le dernier gain
  anti-abuse:
    placed-blocks: true    # pas d'XP pour un bloc posé par un joueur puis recassé
  blocks:
    default: 1
    DIAMOND_ORE: 15
    DEEPSLATE_DIAMOND_ORE: 15
    EMERALD_ORE: 12
    DEEPSLATE_EMERALD_ORE: 12
    GOLD_ORE: 6
    DEEPSLATE_GOLD_ORE: 6
    IRON_ORE: 3
    DEEPSLATE_IRON_ORE: 3
    ANCIENT_DEBRIS: 30
  kills:
    default: 5
    PLAYER: 25
    ENDER_DRAGON: 500
    WITHER: 300
    WARDEN: 400
    ELDER_GUARDIAN: 150
