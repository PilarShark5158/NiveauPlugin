name: Niveau
main: fr.niveau.NiveauPlugin
version: 1.0.0
api-version: '26.2'
description: Systeme de niveaux et d'XP avec recompenses par palier
commands:
  niveau:
    description: Ouvre le chemin de niveaux
    aliases: [niveaux, level, lvl]
    permission: niveau.use
  niveauadmin:
    description: Panel admin des niveaux
    aliases: [niveauxadmin]
    permission: niveau.admin
permissions:
  niveau.use:
    default: true
  niveau.admin:
    default: op
